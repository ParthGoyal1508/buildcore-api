name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # Five suites build the whole Nest application (the route audits), and each needs ~1.2 GB of
      # heap. On the runner's default heap, a worker that had already run other suites ran out of
      # memory loading one and crashed — "Jest worker encountered 4 child process exceptions"
      # (2026-10-18). Two workers with 3 GB each fit the runner; `workerIdleMemoryLimit` in
      # package.json recycles a worker before memory piles up.
      - run: npm test -- --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=3072
