name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # `large-body-routes.spec.ts` builds the whole Nest application (~1.8 GB resident). Run beside
      # another worker, the pair outgrew the runner and the worker was killed — "Jest worker
      # encountered 4 child process exceptions" (2026-10-18, twice, the second time with 3 GB heaps
      # and worker recycling already in place). It now runs alone, after everything else.
      - run: npm test -- --maxWorkers=2 --testPathIgnorePatterns large-body-routes
      - run: npm test -- --runInBand large-body-routes
        env:
          NODE_OPTIONS: --max-old-space-size=3072
