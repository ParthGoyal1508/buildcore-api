name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # `large-body-routes.spec.ts` builds the whole Nest application (~1.8 GB). The 2026-10-18
      # "Jest worker encountered 4 child process exceptions" failures were that suite crashing on
      # secrets CI does not have, not memory; the suite now supplies placeholders. The heap and
      # worker limits stay as headroom for it.
      - run: npm test -- --maxWorkers=2
        env:
          NODE_OPTIONS: --max-old-space-size=3072
